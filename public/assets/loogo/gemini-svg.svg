<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" style="background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Background Pattern -->
  <defs>
    <!-- Gradients for Pillars -->
    <linearGradient id="grad-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ab47bc"/>
      <stop offset="100%" stop-color="#ce93d8"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c6bc0"/>
      <stop offset="100%" stop-color="#7e57c2"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26c6da"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    
    <!-- Button Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Decorative Doodle Style Icons (Subtle) -->
  <g opacity="0.05" stroke="#000" stroke-width="2" fill="none">
    <circle cx="100" cy="100" r="30"/>
    <path d="M 850 80 L 880 120 L 820 120 Z"/>
    <path d="M 150 500 L 200 500 L 175 450 Z"/>
    <circle cx="880" cy="480" r="40"/>
  </g>

  <!-- Header Section -->
  <g id="Header">
    <!-- Updated Logo -->
    <g transform="translate(180, 25)">
      <rect x="0" y="0" width="48" height="52" rx="8" fill="none" stroke="#2e7d32" stroke-width="3"/>
      <path d="M 12 16 L 36 16 M 12 26 L 36 26 M 12 36 L 26 36" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
      <path d="M 28 38 L 42 24 M 34 24 L 42 24 L 42 32" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="24" font-size="20" font-weight="800" fill="#2e7d32" letter-spacing="0.5">SMART SCHOOLS</text>
      <text x="58" y="42" font-size="15" font-weight="700" fill="#388e3c" letter-spacing="2">COMPLEX</text>
    </g>

    <!-- Main Title Banner -->
    <rect x="310" y="90" width="380" height="42" rx="10" fill="#0f172a" filter="url(#shadow)"/>
    <text x="500" y="118" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">School ERP Software</text>
  </g>

  <!-- Buttons Grid Structure -->
  <!-- Column 1: Pink/Purple -->
  <g transform="translate(200, 160)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="url(#grad-pink)" filter="url(#shadow)"/>
    <text x="70" y="26" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Online Admission</text>

    <rect x="0" y="55" width="140" height="42" rx="21" fill="url(#grad-pink)" filter="url(#shadow)"/>
    <text x="70" y="81" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Id-Card &amp; Certificates</text>

    <rect x="0" y="110" width="140" height="42" rx="21" fill="url(#grad-pink)" filter="url(#shadow)"/>
    <text x="70" y="136" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Inventory Management</text>

    <rect x="0" y="165" width="140" height="42" rx="21" fill="url(#grad-pink)" filter="url(#shadow)"/>
    <text x="70" y="191" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Exam Scheduler</text>

    <rect x="0" y="220" width="140" height="42" rx="21" fill="url(#grad-pink)" filter="url(#shadow)"/>
    <text x="70" y="246" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">SMS | Email</text>
  </g>

  <!-- Column 2: Dark Blue/Purple -->
  <g transform="translate(355, 160)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="url(#grad-purple)" filter="url(#shadow)"/>
    <text x="70" y="26" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Fees Management</text>

    <rect x="0" y="55" width="140" height="42" rx="21" fill="url(#grad-purple)" filter="url(#shadow)"/>
    <text x="70" y="75" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Complaint</text>
    <text x="70" y="88" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">Grievance Management</text>

    <rect x="0" y="110" width="140" height="42" rx="21" fill="url(#grad-purple)" filter="url(#shadow)"/>
    <text x="70" y="130" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Transport</text>
    <text x="70" y="143" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Management</text>

    <rect x="0" y="165" width="140" height="42" rx="21" fill="url(#grad-purple)" filter="url(#shadow)"/>
    <text x="70" y="191" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Online Test</text>

    <rect x="0" y="220" width="140" height="42" rx="21" fill="url(#grad-purple)" filter="url(#shadow)"/>
    <text x="70" y="246" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Communication / Chat</text>

    <rect x="0" y="275" width="140" height="42" rx="21" fill="url(#grad-purple)" filter="url(#shadow)"/>
    <text x="70" y="301" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Content Sharing</text>
  </g>

  <!-- Column 3: Cyan/Blue -->
  <g transform="translate(510, 160)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="url(#grad-blue)" filter="url(#shadow)"/>
    <text x="70" y="26" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Finance Management</text>

    <rect x="0" y="55" width="140" height="42" rx="21" fill="url(#grad-blue)" filter="url(#shadow)"/>
    <text x="70" y="75" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Gate Pass</text>
    <text x="70" y="88" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Management</text>

    <rect x="0" y="110" width="140" height="42" rx="21" fill="url(#grad-blue)" filter="url(#shadow)"/>
    <text x="70" y="136" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Lesson Planning</text>

    <rect x="0" y="165" width="140" height="42" rx="21" fill="url(#grad-blue)" filter="url(#shadow)"/>
    <text x="70" y="191" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Classwork &amp; Homework</text>

    <rect x="0" y="220" width="140" height="42" rx="21" fill="url(#grad-blue)" filter="url(#shadow)"/>
    <text x="70" y="246" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Gallery</text>

    <rect x="0" y="275" width="140" height="42" rx="21" fill="url(#grad-blue)" filter="url(#shadow)"/>
    <text x="70" y="301" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">E - Assignments</text>
  </g>

  <!-- Column 4: Orange/Yellow -->
  <g transform="translate(665, 160)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="url(#grad-orange)" filter="url(#shadow)"/>
    <text x="70" y="26" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Attendance Management</text>

    <rect x="0" y="55" width="140" height="42" rx="21" fill="url(#grad-orange)" filter="url(#shadow)"/>
    <text x="70" y="81" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Library</text>

    <rect x="0" y="110" width="140" height="42" rx="21" fill="url(#grad-orange)" filter="url(#shadow)"/>
    <text x="70" y="136" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Time Table</text>

    <rect x="0" y="165" width="140" height="42" rx="21" fill="url(#grad-orange)" filter="url(#shadow)"/>
    <text x="70" y="191" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Result Generation</text>

    <rect x="0" y="220" width="140" height="42" rx="21" fill="url(#grad-orange)" filter="url(#shadow)"/>
    <text x="70" y="246" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Live Class</text>
  </g>

  <!-- Footer Watermark -->
  <text x="500" y="570" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="5">SMART SCHOOLS SOLUTIONS</text>
</svg>
